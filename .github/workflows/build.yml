name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean local generated files
        run: |
          rm -rf .flutter-plugins .flutter-plugins-dependencies .dart_tool build
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug
