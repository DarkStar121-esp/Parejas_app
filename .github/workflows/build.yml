name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Rebuild Android Platform
        run: |
          rm -rf android .flutter-plugins .flutter-plugins-dependencies .dart_tool build test/widget_test.dart
          flutter create --org com.example --platforms=android .
          flutter pub get

      - name: Analyze Dart Code Detailed
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Build APK Verbose
        run: flutter build apk --debug --no-tree-shake-icons --verbose
